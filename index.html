    <link rel="preload" as="fetch" href="/mountains-kh.json" crossorigin="anonymous" />

    <script>
      // Old dev sessions may have a service worker caching Vite's hashed modules.
      // Drop it before the app boots so local development always uses fresh code.
      if (['localhost', '127.0.0.1'].includes(location.hostname) && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (regs.length) Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () { location.reload(); });
        }).catch(function () {});
      }
    </script>

    <title>MountKH — ភ្នំកម្ពុជា</title>
